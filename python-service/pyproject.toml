[project]
name = "ai-crypto-trading-service"
version = "0.1.0"
description = "Quantitative, risk-managed crypto trading service orchestrated by n8n"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning",
]
markers = [
    "slow: tests that take more than a few seconds (backtests, walk-forward)",
]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 95
target-version = "py311"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends() in defaults is the documented pattern
    "RUF012",  # ClassVar annotations on mutable class attrs
    "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals deliberately and import late to control settings.
"tests/*" = ["E402", "SIM117", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/execution/live_exchange.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
